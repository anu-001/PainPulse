name: CI

on:
    push:
        branches:
            - main
            - develop
            - "epic/**"
            - "chore/**"
    pull_request:
        branches:
            - main
            - develop

jobs:
    tests:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                python-version: ["3.11"]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install -e .

            - name: Run unit tests
              run: |
                  pytest tests/unit -q

name: dbt CI

on:
  pull_request:
    branches: [main]

jobs:
  dbt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run dbt parse
        working-directory: dbt/painpulse
        run: dbt parse --no-partial-parse

      - name: Run dbt build
        working-directory: dbt/painpulse
        env:
          PP_DB_HOST: localhost
          PP_DB_PORT: 5432
          PP_DB_NAME: analytics
          PP_DB_USER: analytics_user
          PP_DB_PASSWORD: analytics_pass
        run: dbt build --no-partial-parse